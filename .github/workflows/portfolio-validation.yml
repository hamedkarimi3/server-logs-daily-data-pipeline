name: Static ELT validation
on:
  push:
    branches: [master, feature/gansa-production-readiness]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate repository code syntax
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          for p in Path('.').rglob('*.py'):
              if '.git' not in p.parts: ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
          for p in Path('.').rglob('*.json'):
              if '.git' not in p.parts: json.loads(p.read_text(encoding='utf-8-sig'))
          print('Static validation passed; dbt Cloud integration requires credentials.')
          PY
